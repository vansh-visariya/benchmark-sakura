name = "sakura-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Single custom domain — serves website + API from one worker (no route conflicts).
routes = [
  { pattern = "sakura.vaansh.dev", custom_domain = true }
]

[assets]
directory = "../website"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "sakura"
database_id = "42997448-6455-42b3-919f-839f7c116f4d"

[vars]
ALLOWED_ORIGIN = "https://sakura.vaansh.dev"
